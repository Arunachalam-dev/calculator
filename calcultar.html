<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calcultar.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="calclu">
            <input type="text" placeholder='0' readonly id="output">
            <button onclick="cle()" style="background-color: rgba(231, 218, 36, 0.637);">AC</button>
            <button onclick="del()" style="background-color: rgba(231, 218, 36, 0.637);">DEL</button>
            <button onclick="display('%')" style="background-color: rgba(231, 218, 36, 0.637);">%</button>
            <button onclick="display('+')" style="background-color: rgba(231, 218, 36, 0.637);">+</button>
            <button onclick="display('7')">7</button>
            <button onclick="display('8')">8</button>
            <button onclick="display('9')">9</button>
            <button onclick="display('-')" style="background-color: rgba(231, 218, 36, 0.637);">-</button>
            <button onclick="display('4')">4</button>
            <button onclick="display('5')">5</button>
            <button onclick="display('6')">6</button>
            <button onclick="display('x')" style="background-color: rgba(231, 218, 36, 0.637);">x</button>
            <button onclick="display('3')">3</button>
            <button onclick="display('2')">2</button>
            <button onclick="display('1')">1</button>
            <button onclick="display('+')" style="background-color: rgba(231, 218, 36, 0.637);">+</button>
            <button onclick="display('0')">0</button>
            <button onclick="display('.')" style="background-color: rgba(231, 218, 36, 0.637);">.</button>
            <button  class="eq"  onclick="eqeal('=')" style="background-color: rgba(231, 218, 36, 0.637);">=</button>
            
        </div>
    </div>
    <script src="calclu.js"></script>
</body>
</html>
